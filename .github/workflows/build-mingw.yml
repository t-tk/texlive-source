name: Build on MinGW
run-name: building & testing on MinGW
on:
  push:
    branches:
      - 'build-mingw/**'
      - 'build/**'
jobs:
  Build-on-mingw:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - run: echo "The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "This job is now running on a ${{ runner.os }} server hosted by GitHub."
      - run: echo "Branch [ ${{ github.ref }} ]  Repository [ ${{ github.repository }} ]"
      - name: Check out repository code
        uses: actions/checkout@v3

      - name: install tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          install: >-
            mingw-w64-x86_64-autotools
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-icu
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-pixman
            mingw-w64-x86_64-cairo
            mingw-w64-x86_64-gmp
            mingw-w64-x86_64-mpfr
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-graphite2
            mingw-w64-x86_64-harfbuzz
            mingw-w64-x86_64-fontconfig
            bison
            texinfo

      - name: make libs
        shell: msys2 {0}
        run: |
          mkdir ./Work
          mkdir ./Work/libs

          mkdir ./Work/libs/zlib
          cd ./Work/libs/zlib
          ../../../libs/zlib/configure
          make
          make check

          cd ../../..
          mkdir ./Work/libs/libpng
          cd ./Work/libs/libpng
          ../../../libs/libpng/configure
          make
          make check

          cd ../../..
          mkdir ./Work/libs/libpaper
          cd ./Work/libs/libpaper
          ../../../libs/libpaper/configure
          make
          make check

          cd ../../..
          mkdir ./Work/libs/freetype2
          cd ./Work/libs/freetype2
          ../../../libs/freetype2/configure
          make
          make check

          cd ../../..
          mkdir ./Work/libs/gd
          cd ./Work/libs/gd
          ../../../libs/gd/configure
          make
          make check

      - name: make kpathsea, ptexenc
        shell: msys2 {0}
        run: |
          mkdir ./Work/texk

          mkdir ./Work/texk/kpathsea
          cd ./Work/texk/kpathsea
          ../../../texk/kpathsea/configure
          make
          ## link without libtool
          echo -e "###\n### link without libtool  kpsewhich.exe\n###"
          gcc -Wimplicit -Wreturn-type -g -O2   -o kpsewhich.exe kpsewhich.o .libs/libkpathsea.a
          make check

          cd ../../..
          mkdir ./Work/texk/ptexenc
          cd ./Work/texk/ptexenc
          ../../../texk/ptexenc/configure
          make

      - name: make libs
        shell: msys2 {0}
        run: |
          mkdir ./Work/libs/xpdf
          cd ./Work/libs/xpdf
          ../../../libs/xpdf/configure
          make
          make check

          cd ../../..
          mkdir ./Work/libs/pplib
          cd ./Work/libs/pplib
          ../../../libs/pplib/configure
          make
          make check || echo -e "**\n** failed: pplib.test\n**"
          cat pplib.log

          cd ../../..
          mkdir ./Work/libs/zziplib
          cd ./Work/libs/zziplib
          ../../../libs/zziplib/configure
          make
          make check || echo -e "**\n** failed: zziplib\n**"

          cd ../../..
          mkdir ./Work/libs/teckit
          cd ./Work/libs/teckit
          ../../../libs/teckit/configure
          make
          make check

          cd ../../..
          mkdir ./Work/libs/graphite2
          cd ./Work/libs/graphite2
          ../../../libs/graphite2/configure
          make
          make check

          cd ../../..
          mkdir ./Work/libs/harfbuzz
          cd ./Work/libs/harfbuzz
          ../../../libs/harfbuzz/configure
          make
          make check

          #cd ../../..
          #mkdir ./Work/libs/lua53
          #cd ./Work/libs/lua53
          #../../../libs/lua53/configure
          #make
          #make check || echo -e "**\n** failed: lua53\n**"
          #cat luaerror.log

          #cd ../../..
          #mkdir ./Work/libs/luajit
          #cd ./Work/libs/luajit
          #../../../libs/luajit/configure
          #make
          #make check || echo -e "**\n** failed: luajit\n**"

      - name: web2c
        shell: msys2 {0}
        run: |
          mkdir ./Work/texk/web2c
          cd ./Work/texk/web2c
          ../../../texk/web2c/configure \
            --srcdir=../../../texk/web2c \
            --disable-all-pkgs \
            --enable-debug \
            --enable-tex  --enable-tex-synctex \
            --enable-ptex  --enable-ptex-synctex \
            --enable-eptex  --enable-eptex-synctex \
            --enable-uptex  --enable-uptex-synctex \
            --enable-euptex  --enable-euptex-synctex \
            --disable-mp  --disable-pmp  --disable-upmp \
            --enable-pdftex  --enable-pdftex-synctex \
            --enable-web-progs  --enable-synctex \
            --disable-mf  --disable-mf-nowin \
            --disable-etex  --disable-etex-synctex \
            --disable-aleph \
            --disable-luatex  --disable-luajittex  --disable-luahbtex  --disable-luajithbtex \
            --enable-xetex  --enable-xetex-synctex \
            --disable-mflua  --disable-mflua-nowin  --disable-mfluajit  --disable-mfluajit-nowin \
            --disable-epsfwin  --disable-hp2627win  --disable-mftalkwin  --disable-nextwin \
            --disable-regiswin  --disable-suntoolswin  --disable-tektronixwin  --disable-unitermwin \
            --disable-missing \
            --with-gnu-ld \
            --without-x \
            --without-mf-x-toolkit \
            --without-system-kpathsea \
            --without-system-ptexenc \
            --without-system-zlib \
            --without-system-libpng \
            --without-system-freetype2 \
            --with-system-pixman \
            --with-system-cairo \
            --with-system-gmp \
            --with-system-mpfr \
            --without-system-poppler \
            --without-system-xpdf \
            --without-system-zziplib \
            --without-system-teckit \
            --with-system-icu \
            --without-system-graphite2 \
            --without-system-harfbuzz
          make ctie.exe
          make ctwill.exe
          make ctwill-refsort.exe || echo ""
          make ctwill-twinx.exe || echo ""
          make cweave.exe
          make tie.exe
          make twill.exe || echo ""
          make updvitype.web
          make updvitype.p
          make updvitype.c
          make updvitype.exe
          make uppltotf.web
          make uppltotf.p
          make uppltotf.c
          make uppltotf.exe
          make uptftopl.web
          make uptftopl.p
          make uptftopl.c
          make uptftopl.exe
          make tex.p
          make tex.exe
          # make etex.web
          # make etex.p
          # make etex.exe
          make ptex.web
          make ptex.p
          make ptex.exe
          ## link without libtool
          echo -e "###\n### link without libtool  ptex.exe\n###"
          gcc -Wimplicit -Wreturn-type -g -O2   -o ptex.exe ptexdir/ptex-ptexextra.o ptex-ptexini.o ptex-ptex0.o ptex-ptex-pool.o libkanji.a lib/libp.a /d/a/texlive-source/texlive-source/Work/texk/ptexenc/.libs/libptexenc.a lib/lib.a /d/a/texlive-source/texlive-source/Work/texk/kpathsea/.libs/libkpathsea.a /d/a/texlive-source/texlive-source/Work/libs/zlib/libz.a -lwsock32 || echo -e "**\n** fail to link ptex.exe"

          make uptex.web
          make uptex.p
          make uptex.exe
          ## link without libtool
          echo -e "###\n### link without libtool  uptex.exe\n###"
          gcc -Wimplicit -Wreturn-type -g -O2   -o uptex.exe uptexdir/uptex-uptexextra.o uptex-uptexini.o uptex-uptex0.o uptex-uptex-pool.o libukanji.a lib/libp.a /d/a/texlive-source/texlive-source/Work/texk/ptexenc/.libs/libptexenc.a lib/lib.a /d/a/texlive-source/texlive-source/Work/texk/kpathsea/.libs/libkpathsea.a /d/a/texlive-source/texlive-source/Work/libs/zlib/libz.a -lwsock32 || echo -e "**\n** fail to link uptex.exe"

          make eptex.web
          make eptex.p
          make eptex.exe
          ## link without libtool
          echo -e "###\n### link without libtool  eptex.exe\n###"
          gcc -Wimplicit -Wreturn-type -g -O2   -o eptex.exe eptexdir/eptex-eptexextra.o synctexdir/eptex-synctex.o eptex-eptexini.o eptex-eptex0.o eptex-eptex-pool.o libkanji.a lib/libp.a /d/a/texlive-source/texlive-source/Work/texk/ptexenc/.libs/libptexenc.a lib/lib.a /d/a/texlive-source/texlive-source/Work/texk/kpathsea/.libs/libkpathsea.a -lwsock32 libmd5.a /d/a/texlive-source/texlive-source/Work/libs/zlib/libz.a /d/a/texlive-source/texlive-source/Work/libs/zlib/libz.a || echo -e "**\n** fail to link eptex.exe"

          make euptex.web
          make euptex.p
          make euptex.exe
          ## link without libtool
          echo -e "###\n### link without libtool  euptex.exe\n###"
          gcc -Wimplicit -Wreturn-type -g -O2   -o euptex.exe euptexdir/euptex-euptexextra.o synctexdir/euptex-synctex.o euptex-euptexini.o euptex-euptex0.o euptex-euptex-pool.o libukanji.a lib/libp.a /d/a/texlive-source/texlive-source/Work/texk/ptexenc/.libs/libptexenc.a lib/lib.a /d/a/texlive-source/texlive-source/Work/texk/kpathsea/.libs/libkpathsea.a -lwsock32 libmd5.a /d/a/texlive-source/texlive-source/Work/libs/zlib/libz.a /d/a/texlive-source/texlive-source/Work/libs/zlib/libz.a || echo -e "**\n** fail to link euptex.exe"

          make upbibtex.web
          make upbibtex.p
          make upbibtex.c
          make upbibtex.exe
          make dvitype.exe
          make dvicopy.exe
          make pltotf.exe
          make tftopl.exe
          make bibtex.exe
          make gftodvi.exe
          make gftopk.exe
          make gftype.exe
          make mft.exe
          make patgen.exe
          make pktogf.exe
          make pktype.exe
          make pooltype.exe
          make tftopl.exe || echo "fail to make tftopl.exe"
          make vftovp.exe || echo "fail to make vftovp.exe"
          make vptovf.exe || echo "fail to make vptovf.exe"
          make weave.exe || echo "fail to make weave.exe"
          # make pmp.web
          # make pmp.p
          # make pmp.c
          # make pmp.exe
          # make upmp.web
          # make upmp.p
          # make upmp.c
          # make upmp.exe
          # make pmpopst.exe || echo "fail to make pmpopst.exe"
          # make upmpopst.exe || echo "fail to make upmpopst.exe"

          make pdftex.exe || echo "fail to make pdftex.exe"
          ## link without libtool
          echo -e "###\n### link without libtool  pdftex.exe\n###"
          g++ -Wreturn-type -Wno-write-strings -g -O2   -o pdftex.exe pdftexdir/pdftex-pdftexextra.o synctexdir/pdftex-synctex.o pdftex-pdftexini.o pdftex-pdftex0.o pdftex-pdftex-pool.o libpdftex.a /d/a/texlive-source/texlive-source/Work/libs/libpng/libpng.a /d/a/texlive-source/texlive-source/Work/libs/zlib/libz.a /d/a/texlive-source/texlive-source/Work/libs/xpdf/libxpdf.a -lgdi32 libmd5.a lib/lib.a /d/a/texlive-source/texlive-source/Work/texk/kpathsea/.libs/libkpathsea.a -lwsock32 || echo -e "**\n** fail to link pdftex.exe"

          make mf.exe || echo "fail to make mf.exe"
          make hitex.exe || echo "fail to make hitex.exe"
          make synctex.exe || echo "fail to make synctex.exe"
          make ttf2afm.exe || echo "fail to make ttf2afm.exe"

          make xetex.exe || echo "fail to make xetex.exe"
          ## link without libtool
          echo -e "###\n### link without libtool  xetex.exe\n###"
          g++  -g -O2   -o xetex.exe xetexdir/xetex-xetexextra.o synctexdir/xetex-synctex.o xetex-xetexini.o xetex-xetex0.o xetex-xetex-pool.o libxetex.a /d/a/texlive-source/texlive-source/Work/libs/harfbuzz/libharfbuzz.a /d/a/texlive-source/texlive-source/Work/libs/graphite2/libgraphite2.a -L/mingw64/lib -licuin -licuuc -licudt -lpthread -lm     /d/a/texlive-source/texlive-source/Work/libs/teckit/libTECkit.a /d/a/texlive-source/texlive-source/Work/libs/libpng/libpng.a /d/a/texlive-source/texlive-source/Work/libs/freetype2/libfreetype.a /d/a/texlive-source/texlive-source/Work/libs/pplib/libpplib.a /d/a/texlive-source/texlive-source/Work/libs/zlib/libz.a libmd5.a -lfontconfig -lfreetype lib/lib.a /d/a/texlive-source/texlive-source/Work/texk/kpathsea/.libs/libkpathsea.a -lwsock32 || echo -e "**\n** fail to link xetex.exe"

          # make wofm2opl.exe || echo "fail to make wofm2opl.exe"
          # make wopl2ofm.exe || echo "fail to make wopl2ofm.exe"
          # make wovf2ovp.exe || echo "fail to make wovf2ovp.exe"
          # make wovp2ovf.exe || echo "fail to make wovp2ovf.exe"
          # make odvicopy.exe || echo "fail to make odvicopy.exe"
          # make odvitype.exe || echo "fail to make odvitype.exe"
          # make otangle.exe  || echo "fail to make otangle.exe"

          # make luatex.exe      || echo "fail to make luatex.exe"
          # make luajittex.exe   || echo "fail to make luajittex.exe"
          # make luahbtex.exe    || echo "fail to make luahbtex.exe"
          # make luajithbtex.exe || echo "fail to make luajithbtex.exe"

          # make aleph.exe       || echo "fail to make aleph.exe"

          # make mflua.exe       || echo "fail to make mflua.exe"
          # make mfluajit.exe    || echo "fail to make mfluajit.exe"

          echo "!!! make complete !!!"

      - name: web2c version check
        shell: msys2 {0}
        run: |
          cd ./Work/texk/web2c
          ./ctie.exe --version || echo "ctie"
          echo ""
          ./ctwill.exe --version || echo "ctwill"
          echo ""
          ./cweave.exe --version || echo "cwaeve"
          echo ""
          ./tie.exe --version || echo "tie"
          echo ""
          ./twill.exe --version || echo "twill"
          echo ""
          ./ptex.exe --version || echo "ptex"
          echo ""
          ./uptex.exe --version || echo "uptex"
          echo ""
          ./eptex.exe --version || echo "eptex"
          echo ""
          ./euptex.exe --version || echo "euptex"
          echo ""
          ./updvitype.exe --version || echo "updvitype"
          echo ""
          ./uppltotf.exe --version || echo "uppltotf"
          echo ""
          ./uptftopl.exe --version || echo "uptftopl"
          echo ""
          ./upbibtex.exe --version || echo "upbibtex"
          echo ""
          ./dvitype.exe --version || echo "dvitype"
          echo ""
          ./dvicopy.exe --version || echo "dvicopy"
          echo ""
          ./pltotf.exe --version || echo "pltotf"
          echo ""
          ./tftopl.exe --version || echo "tftopl"
          echo ""
          ./bibtex.exe --version || echo "bibtex"
          echo ""
          ./gftodvi.exe --version || echo "gftodvi"
          echo ""
          ./gftopk.exe --version || echo "gftopk"
          echo ""
          ./gftype.exe --version || echo "gftype"
          echo ""
          ./mft.exe --version || echo "mft"
          echo ""
          ./patgen.exe --version || echo "patgen"
          echo ""
          ./pktogf.exe --version || echo "pktogf"
          echo ""
          ./pktype.exe --version || echo "pktype"
          echo ""
          ./pooltype.exe --version || echo "pooltype"
          echo ""
          ./pmpost.exe --version || echo "pmpost"
          echo ""
          ./upmpost.exe --version || echo "upmpost"
          echo ""
          ./pdftex.exe --version || echo "pdftex"
          echo ""
          ./mf.exe --version || echo "mf"
          echo ""
          ./synctex.exe --version || echo "synctex"
          echo ""
          ./hitex.exe --version || echo "hitex"
          echo ""
          ./ttf2afm.exe -v || echo "ttf2afm"
          echo ""
          ./xetex.exe --version || echo "xetex"
          echo ""
          ./wofm2opl.exe --version || echo "wofm2opl"
          echo ""
          ./wopl2ofm.exe --version || echo "wopl2ofm"
          echo ""
          ./wovf2ovp.exe --version || echo "wovf2ovp"
          echo ""
          ./wovp2ovf.exe --version || echo "wovp2ovf"
          echo ""
          ./odvicopy.exe --version || echo "odvicopy"
          echo ""
          ./odvitype.exe --version || echo "odvitype"
          echo ""
          ./otangle.exe --version  || echo "otangle"
          echo ""
          ./aleph.exe --version    || echo "aleph"
          echo ""
          ./mflua.exe --version    || echo "mflua"
          echo ""
          ./mfluajit.exe --version || echo "mfluajit"
          echo ""
          ls -l ./*.exe
        env:
          TEXMFCNF: "../../../texk/kpathsea"

      - name: web2c check
        shell: msys2 {0}
        run: |
          cd ./Work/texk/web2c
          $srcdir/ctiedir/ctie.test   || echo -e "**\n** failed: ctie.test\n**"
          $srcdir/cwebdir/ctwill.test || echo -e "**\n** failed: ctwill.test\n**"
          $srcdir/cwebdir/cweave.test || echo -e "**\n** failed: cweave.test\n**"
          $srcdir/tiedir/tie.test     || echo -e "**\n** failed: tie.test\n**"
          echo ""

          export KPSEWHICH="./kpsewhich.exe"
          $srcdir/dvicopy.test        || echo -e "**\n** failed: dvicopy.test\n**"
          $srcdir/dvitype.test        || echo -e "**\n** failed: dvitype.test\n**"
          echo ""

          $srcdir/gftodvi.test        || echo -e "**\n** failed: gftodvi.test\n**"
          $srcdir/gftopk.test         || echo -e "**\n** failed: gftopk.test\n**"
          $srcdir/gftype.test         || echo -e "**\n** failed: gftype.test\n**"
          echo ""
          $srcdir/mft.test            || echo -e "**\n** failed: mft.test\n**"
          echo ""
          $srcdir/patgen.test         || echo -e "**\n** failed: patgen.test\n**"
          $srcdir/pktogf.test         || echo -e "**\n** failed: pktogf.test\n**"
          $srcdir/pktype.test         || echo -e "**\n** failed: pktype.test\n**"
          $srcdir/pltotf.test         || echo -e "**\n** failed: pltotf.test\n**"
          echo ""

          $srcdir/pooltype.test       || echo -e "**\n** failed: pooltype.test\n**"
          $srcdir/tftopl.test         || echo -e "**\n** failed: tftopl.test\n**"
          $srcdir/vftovp.test         || echo -e "**\n** failed: vftovp.test\n**"
          $srcdir/vptovf.test         || echo -e "**\n** failed: vptovf.test\n**"
          echo ""
          $srcdir/weave.test          || echo -e "**\n** failed: weave.test\n**"
          $srcdir/tangle.test         || echo -e "**\n** failed: tangle.test\n**"
          $srcdir/twill.test          || echo -e "**\n** failed: twill.test\n**"
          echo ""

          $srcdir/ptexdir/pver.test     || echo -e "**\n** failed: pver.test\n**"
          $srcdir/eptexdir/epver.test   || echo -e "**\n** failed: epver.test\n**"
          $srcdir/uptexdir/upver.test   || echo -e "**\n** failed: upver.test\n**"
          $srcdir/uptexdir/upkcat.test  || echo -e "**\n** failed: upkcat.test\n**"
          $srcdir/euptexdir/eupver.test || echo -e "**\n** failed: eupver.test\n**"
          # $srcdir/uptexdir/sample.test  || echo -e "**\n** failed: sample.test\n**"
          # echo ""
          $srcdir/uptexdir/updvitype.test  || echo -e "**\n** failed: updvitype.test\n**"
          $srcdir/uptexdir/uppltotf.test  || echo -e "**\n** failed: uppltotf.test\n**"
          $srcdir/uptexdir/uptftopl.test  || echo -e "**\n** failed: uptftopl.test\n**"
          $srcdir/uptexdir/yokotate.test  || echo -e "**\n** failed: yokotate.test\n**"
          $srcdir/uptexdir/upbibtex.test  || echo -e "**\n** failed: upbibtex.test\n**"
          # $srcdir/uptexdir/upbibtex-mem.test  || echo -e "**\n** failed: upbibtex-mem.test\n**"
          # echo ""
          $srcdir/uptexdir/upbibtex-openout-test.pl  || echo -e "**\n** failed: upbibtex-openout-test.pl\n**"
          $srcdir/uptexdir/upbibtex-longline-test.pl || echo -e "**\n** failed: upbibtex-longline-test.pl\n**"
          $srcdir/uptexdir/nissya.test    || echo -e "**\n** failed: nissya.test\n**"
          $srcdir/uptexdir/skipjfmp.test  || echo -e "**\n** failed: skipjfmp.test\n**"
          $srcdir/uptexdir/newjfm.test    || echo -e "**\n** failed: newjfm.test\n**"
          $srcdir/uptexdir/uparse.test    || echo -e "**\n** failed: uparse.test\n**"
          $srcdir/uptexdir/gkhuge.test    || echo -e "**\n** failed: gkhuge.test\n**"

          export abs_srcdir=../$srcdir
          $srcdir/mftraptest.test            || echo -e "**\n** failed: mftraptest.test\n**"
          echo ""
          $srcdir/triptest.test              || echo -e "**\n** failed: triptest.test\n**"
          # $srcdir/etexdir/etriptest.test     || echo -e "**\n** failed: etexdir/etriptest.test\n**"
          # $srcdir/eptexdir/pdfprimitive.test || echo -e "**\n** failed: eptexdir/pdfprimitive.test\n**"
          $srcdir/ptexdir/ptriptest.test     || echo -e "**\n** failed: ptexdir/ptriptest.test\n**"
          $srcdir/uptexdir/ptriptest.test    || echo -e "**\n** failed: uptexdir/ptriptest.test\n**"
          $srcdir/uptexdir/uptriptest.test   || echo -e "**\n** failed: uptexdir/uptriptest.test\n**"
          $srcdir/eptexdir/eptriptest.test   || echo -e "**\n** failed: eptexdir/eptriptest.test\n**"
          $srcdir/euptexdir/euptriptest.test || echo -e "**\n** failed: euptexdir/euptriptest.test\n**"
          echo ""
          $srcdir/ptexdir/wcfname.test       || echo -e "**\n** failed: ptexdir/wcfname.test\n**"
          $srcdir/eptexdir/wcfname.test      || echo -e "**\n** failed: eptexdir/wcfname.test\n**"
          $srcdir/uptexdir/wcfname0.test     || echo -e "**\n** failed: uptexdir/wcfname0.test\n**"
