          $srcdir/xetexdir/wcfname.test         || echo -e "**\n** failed: xetexdir/wcfname.test\n**"
        env:
          srcdir: "../../../texk/web2c"
          TEXMFCNF: "../../../texk/kpathsea"
          command_line_encoding: "utf-8"

      - name: web2c, make, makecheck
        shell: msys2 {0}
        run: |
          cd ./Work/texk/web2c
          make       || echo "**\n** failed: web2c: make\n**"
          make check || echo "**\n** failed: web2c: make check\n**"

