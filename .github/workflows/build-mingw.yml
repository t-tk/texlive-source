      - name: web2c triptest
        shell: msys2 {0}
        run: |
          cd ./Work/texk/web2c

          export abs_srcdir=../$srcdir
          export LN_S=cp
          export DIFF=diff
          export DIFFFLAGS="--strip-trailing-cr --ignore-matching-lines 'DVItype'"
          ./pltotf --version || echo
          ./tftopl --version || echo
          ./dvitype --version || echo
          ./gftype --version || echo
          $srcdir/mftraptest.test            || { echo -e "**\n** failed: mftraptest.test\n**"            ; cat mftraptest.log ; }
          $srcdir/triptest.test              || { echo -e "**\n** failed: triptest.test\n**"              ; cat triptest.log ; }
          # $srcdir/etexdir/etriptest.test     || { echo -e "**\n** failed: etexdir/etriptest.test\n**"     ; cat etriptest.log ; }
          # $srcdir/eptexdir/pdfprimitive.test || { echo -e "**\n** failed: eptexdir/pdfprimitive.test\n**" ; cat pdfprimitivetest.log ; }
          $srcdir/ptexdir/ptriptest.test     || { echo -e "**\n** failed: ptexdir/ptriptest.test\n**"     ; cat ptexdir/ptriptest.log ; }
          $srcdir/uptexdir/ptriptest.test    || { echo -e "**\n** failed: uptexdir/ptriptest.test\n**"    ; cat uptexdir/ptriptest.log ; }
          $srcdir/uptexdir/uptriptest.test   || { echo -e "**\n** failed: uptexdir/uptriptest.test\n**"   ; cat uptexdir/uptriptest.log ; }
          $srcdir/eptexdir/eptriptest.test   || { echo -e "**\n** failed: eptexdir/eptriptest.test\n**"   ; cat eptexdir/eptriptest.log ; }
          $srcdir/euptexdir/euptriptest.test || { echo -e "**\n** failed: euptexdir/euptriptest.test\n**" ; cat euptexdir/euptriptest.log ; }
        env:
          srcdir: "../../../texk/web2c"
          TEXMFCNF: "../../../texk/kpathsea"

      - name: web2c check pTeX
        shell: msys2 {0}
        run: |
          cd ./Work/texk/web2c
          chcp.com
          $srcdir/ptexdir/wcfname.test          || echo -e "**\n** failed: ptexdir/wcfname.test\n**"
          $srcdir/eptexdir/wcfname.test         || echo -e "**\n** failed: eptexdir/wcfname.test\n**"
          $srcdir/uptexdir/wcfname0.test        || echo -e "**\n** failed: uptexdir/wcfname0.test\n**"
          $srcdir/euptexdir/wcfname0.test       || echo -e "**\n** failed: euptexdir/wcfname0.test\n**"
          chcp.com 932
          $srcdir/ptexdir/wcfname.test          || echo -e "**\n** failed: ptexdir/wcfname.test\n**"
          $srcdir/eptexdir/wcfname.test         || echo -e "**\n** failed: eptexdir/wcfname.test\n**"
          $srcdir/uptexdir/wcfname0.test        || echo -e "**\n** failed: uptexdir/wcfname0.test\n**"
          $srcdir/euptexdir/wcfname0.test       || echo -e "**\n** failed: euptexdir/wcfname0.test\n**"
          locale -a
        env:
          srcdir: "../../../texk/web2c"
          TEXMFCNF: "../../../texk/kpathsea"
          guess_input_kanji_encoding: "1"
          command_line_encoding: "none"
          ExeExt: ".exe"

      - name: web2c check upTeX
        shell: msys2 {0}
