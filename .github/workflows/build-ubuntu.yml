name: Build on Ubuntu
run-name: building & testing on Ubuntu
on:
  push:
    branches:
      - 'build-ubuntu/**'
      - 'build/**'
jobs:
  Build-on-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - run: echo "The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "This job is now running on a ${{ runner.os }} server hosted by GitHub."
      - run: echo "Branch [ ${{ github.ref }} ]  Repository [ ${{ github.repository }} ]"
      - name: Check out repository code
        uses: actions/checkout@v3

      - name: make libs
        shell: bash
        run: |
          mkdir -p ./Work/libs/{zlib,libpng,libpaper,freetype2,gd,potrace}
          cd ${{ github.workspace }}/Work/libs/zlib
          ../../../libs/zlib/configure
          make
          make check
          cd ${{ github.workspace }}/Work/libs/libpng
          ../../../libs/libpng/configure
          make
          make check
          cd ${{ github.workspace }}/Work/libs/libpaper
          ../../../libs/libpaper/configure
          make
          make check
          cd ${{ github.workspace }}/Work/libs/freetype2
          ../../../libs/freetype2/configure
          make
          make check
          cd ${{ github.workspace }}/Work/libs/gd
          ../../../libs/gd/configure
          make
          make check
          cd ${{ github.workspace }}/Work/libs/potrace
          ../../../libs/potrace/configure
          make
          make check

      - name: make kpathsea, ptexenc
        shell: bash
        run: |
          mkdir -p ./Work/texk/{kpathsea,ptexenc}
          cd ${{ github.workspace }}/Work/texk/kpathsea
          ../../../texk/kpathsea/configure
          make
          make check
          cd ${{ github.workspace }}/Work/texk/ptexenc
          ../../../texk/ptexenc/configure
          make

      - name: afm2pl
        shell: bash
        run: |
          prog='afm2pl'
          mkdir -p ./Work/texk/$prog
          cd ./Work/texk/$prog
          ../../../texk/$prog/configure
          make
          make check

      - name: chktex
        shell: bash
        run: |
          prog='chktex'
          mkdir -p ./Work/texk/$prog
          cd ./Work/texk/$prog
          ../../../texk/$prog/configure
          make
          make check

      - name: cjkutils
        shell: bash
        run: |
          prog='cjkutils'
          mkdir -p ./Work/texk/$prog
          cd ./Work/texk/$prog
          ../../../texk/$prog/configure
          make
          make check

      - name: detex
        shell: bash
        run: |
          prog='detex'
          mkdir -p ./Work/texk/$prog
          cd ./Work/texk/$prog
          ../../../texk/$prog/configure
          make
          make check

      - name: dtl
        shell: bash
        run: |
          prog='dtl'
          mkdir -p ./Work/texk/$prog
          cd ./Work/texk/$prog
          ../../../texk/$prog/configure
          make
          make check

      - name: dviljk
        shell: bash
        run: |
          prog='dviljk'
          mkdir -p ./Work/texk/$prog
          cd ./Work/texk/$prog
          ../../../texk/$prog/configure
          make
          make check

      - name: dvipng
        shell: bash
        run: |
          prog='dvipng'
          mkdir -p ./Work/texk/$prog
          cd ./Work/texk/$prog
          ../../../texk/$prog/configure \
            --with-system-freetype2
          make
          make check

      - name: dvipos
        shell: bash
        run: |
          prog='dvipos'
          mkdir -p ./Work/texk/$prog
          cd ./Work/texk/$prog
          ../../../texk/$prog/configure
          make
          make check

      #- name: dvisvgm
      #  shell: bash
      #  run: |
      #    prog='dvisvgm'
      #    mkdir -p ./Work/texk/$prog
      #    cd ./Work/texk/$prog
      #    ../../../texk/$prog/configure
      #    make
      #    make check

      - name: gregorio
        shell: bash
        run: |
          prog='gregorio'
          mkdir -p ./Work/texk/$prog
          cd ./Work/texk/$prog
          ../../../texk/$prog/configure
          make
          make check

      - name: gsftopk
        shell: bash
        run: |
          prog='gsftopk'
          mkdir -p ./Work/texk/$prog
          cd ./Work/texk/$prog
          ../../../texk/$prog/configure
          make
          make check

      - name: lcdf-typetools
        shell: bash
        run: |
          prog='lcdf-typetools'
          mkdir -p ./Work/texk/$prog
          cd ./Work/texk/$prog
          ../../../texk/$prog/configure
          make
          make check

      - name: makeindex
        shell: bash
        run: |
          prog='makeindexk'
          mkdir -p ./Work/texk/$prog
          cd ./Work/texk/$prog
          ../../../texk/$prog/configure
          make
          make check

      - name: musixtnt
        shell: bash
        run: |
          prog='musixtnt'
          mkdir -p ./Work/texk/$prog
          cd ./Work/texk/$prog
          ../../../texk/$prog/configure
          make
          make check

      - name: ps2pk
        shell: bash
        run: |
          prog='ps2pk'
          mkdir -p ./Work/texk/$prog
          cd ./Work/texk/$prog
          ../../../texk/$prog/configure
          make
          make check

      - name: psutils
        shell: bash
        run: |
          prog='psutils'
          mkdir -p ./Work/texk/$prog
          cd ./Work/texk/$prog
          ../../../texk/$prog/configure
          make
          make check

      - name: tex4htk
        shell: bash
        run: |
          prog='tex4htk'
          mkdir -p ./Work/texk/$prog
          cd ./Work/texk/$prog
          ../../../texk/$prog/configure
          make
          make check

      - name: texlive
        shell: bash
        run: |
          prog='texlive'
          mkdir -p ./Work/texk/$prog
          cd ./Work/texk/$prog
          ../../../texk/$prog/configure
          make
          make check

      - name: ttf2pk2
        shell: bash
        run: |
          prog='ttf2pk2'
          mkdir -p ./Work/texk/$prog
          cd ./Work/texk/$prog
          ../../../texk/$prog/configure \
            --with-system-freetype2
          make
          make check

      - name: ttfdump
        shell: bash
        run: |
          prog='ttfdump'
          mkdir -p ./Work/texk/$prog
          cd ./Work/texk/$prog
          ../../../texk/$prog/configure
          make
          make check

      - name: bibtex-x
        shell: bash
        run: |
          mkdir -p ./Work/texk/bibtex-x
          cd ./Work/texk/bibtex-x
          ../../../texk/bibtex-x/configure \
            --with-system-icu
          make
          ./bibtex8 --version
          ./bibtexu --version
          make check

      - name: upmendex
        shell: bash
        run: |
          mkdir -p ./Work/texk/upmendex
          cd ./Work/texk/upmendex
          ../../../texk/upmendex/configure \
            --with-system-icu
          make
          ./upmendex --help
          make check

      - name: dvipdfm-x
        shell: bash
        run: |
          mkdir -p ./Work/texk/dvipdfm-x
          cd ./Work/texk/dvipdfm-x
          ../../../texk/dvipdfm-x/configure
          make
          make check

      - name: dvipsk
        shell: bash
        run: |
          mkdir -p ./Work/texk/dvipsk
          cd ./Work/texk/dvipsk
          ../../../texk/dvipsk/configure
          make
          make check

      - name: makejvf
        shell: bash
        run: |
          mkdir -p ./Work/texk/makejvf
          cd ./Work/texk/makejvf
          ../../../texk/makejvf/configure
          make
          make check

      - name: mendex
        shell: bash
        run: |
          mkdir -p ./Work/texk/mendexk
          cd ./Work/texk/mendexk
          ../../../texk/mendexk/configure
          make
          make check

      - name: dviout-util
        shell: bash
        run: |
          mkdir -p ./Work/texk/dviout-util
          cd ./Work/texk/dviout-util
          ../../../texk/dviout-util/configure
          make
          make check

      - name: dvi2tty
        shell: bash
        run: |
          mkdir -p ./Work/texk/dvi2tty
          cd ./Work/texk/dvi2tty
          ../../../texk/dvi2tty/configure
          make
          make check

      - name: seetex
        shell: bash
        run: |
          mkdir -p ./Work/texk/seetexk
          cd ./Work/texk/seetexk
          ../../../texk/seetexk/configure
          make
          make check

      - name: dvidvi
        shell: bash
        run: |
          mkdir -p ./Work/texk/dvidvi
          cd ./Work/texk/dvidvi
          ../../../texk/dvidvi/configure
          make
          make check

      - name: make libs
        shell: bash
        run: |
          mkdir -p ./Work/libs/{gmp,mpfr,xpdf}
          cd ${{ github.workspace }}/Work/libs/gmp
          ../../../libs/gmp/configure
          make
          make check
          cd ${{ github.workspace }}/Work/libs/mpfr
          ../../../libs/mpfr/configure
          make
          make check
          cd ${{ github.workspace }}/Work/libs/xpdf
          ../../../libs/xpdf/configure
          make
          make check

      - name: web2c
        shell: bash
        run: |
          mkdir -p ./Work/texk/web2c
          cd ./Work/texk/web2c
          ../../../texk/web2c/configure \
            --srcdir=../../../texk/web2c \
            --disable-all-pkgs \
            --enable-debug \
            --enable-tex  --disable-tex-synctex \
            --enable-ptex  --enable-ptex-synctex \
            --enable-eptex  --enable-eptex-synctex \
            --enable-uptex  --enable-uptex-synctex \
            --enable-euptex  --enable-euptex-synctex \
            --enable-pmp  --enable-upmp \
            --enable-pdftex  --enable-pdftex-synctex \
            --enable-web-progs  --enable-synctex \
            --enable-mf  --enable-mf-nowin \
            --enable-etex  --enable-etex-synctex \
            --disable-aleph \
            --disable-luatex  --disable-luajittex \
            --disable-luahbtex  --disable-luajithbtex \
            --disable-mp \
            --disable-xetex  --disable-xetex-synctex \
            --disable-mflua  --disable-mflua-nowin \
            --disable-mfluajit  --disable-mfluajit-nowin \
            --disable-epsfwin \
            --disable-hp2627win \
            --disable-mftalkwin \
            --disable-nextwin \
            --disable-regiswin \
            --disable-suntoolswin \
            --disable-tektronixwin \
            --disable-unitermwin \
            --disable-missing \
            --with-gnu-ld \
            --without-x \
            --without-mf-x-toolkit \
            --without-system-kpathsea \
            --without-system-ptexenc \
            --without-system-zlib \
            --without-system-libpng \
            --without-system-freetype2 \
            --with-system-pixman \
            --with-system-cairo \
            --without-system-gmp \
            --without-system-mpfr \
            --without-system-poppler \
            --without-system-xpdf \
            --without-system-zziplib \
            --without-system-teckit \
            --without-system-icu \
            --without-system-graphite2 \
            --without-system-harfbuzz
          make

      - name: web2c triptest
        shell: bash
        run: |
          cd ./Work/texk/web2c
          export abs_srcdir=../$srcdir
          $srcdir/triptest.test              || echo -e "**\n** failed: triptest.test\n**"
          $srcdir/etexdir/etriptest.test     || echo -e "**\n** failed: etexdir/etriptest.test\n**"
          $srcdir/ptexdir/ptriptest.test     || echo -e "**\n** failed: ptexdir/ptriptest.test\n**"
          $srcdir/uptexdir/ptriptest.test    || echo -e "**\n** failed: uptexdir/ptriptest.test\n**"
          $srcdir/uptexdir/uptriptest.test   || echo -e "**\n** failed: uptexdir/uptriptest.test\n**"
          $srcdir/eptexdir/eptriptest.test   || echo -e "**\n** failed: eptexdir/eptriptest.test\n**"
          $srcdir/euptexdir/euptriptest.test || echo -e "**\n** failed: euptexdir/euptriptest.test\n**"
        env:
          srcdir: "../../../texk/web2c"
          TEXMFCNF: "../../../texk/kpathsea"

      - name: web2c make check
        shell: bash
        run: |
          cd ./Work/texk/web2c
          make check

      - run: echo "⛄ This job's status is ${{ job.status }}."
