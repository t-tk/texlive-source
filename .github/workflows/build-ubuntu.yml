      - name: bibtex-x
        shell: bash
        run: |
          mkdir -p ./Work/texk/bibtex-x
          cd ./Work/texk/bibtex-x
          ../../../texk/bibtex-x/configure \
            --with-system-icu
          make
          ./bibtex8 --version
          ./bibtexu --version
          make check

      - name: upmendex
        shell: bash
        run: |
          mkdir -p ./Work/texk/upmendex
          cd ./Work/texk/upmendex
          ../../../texk/upmendex/configure \
            --with-system-icu
          make
          ./upmendex --help
          make check

      - name: dvipdfm-x
        shell: bash
        run: |
          mkdir -p ./Work/texk/dvipdfm-x
          cd ./Work/texk/dvipdfm-x
          ../../../texk/dvipdfm-x/configure
          make
          make check

      - name: dvipsk
        shell: bash
        run: |
          mkdir -p ./Work/texk/dvipsk
          cd ./Work/texk/dvipsk
          ../../../texk/dvipsk/configure
          make
          make check

      - name: makejvf
        shell: bash
        run: |
          mkdir -p ./Work/texk/makejvf
          cd ./Work/texk/makejvf
          ../../../texk/makejvf/configure
          make
          make check

      - name: mendex
        shell: bash
        run: |
          mkdir -p ./Work/texk/mendexk
          cd ./Work/texk/mendexk
          ../../../texk/mendexk/configure
          make
          make check

      - name: dviout-util
        shell: bash
        run: |
          mkdir -p ./Work/texk/dviout-util
          cd ./Work/texk/dviout-util
          ../../../texk/dviout-util/configure
          make
          make check

      - name: dvi2tty
        shell: bash
        run: |
          mkdir -p ./Work/texk/dvi2tty
          cd ./Work/texk/dvi2tty
          ../../../texk/dvi2tty/configure
          make
          make check

      - name: seetex
        shell: bash
        run: |
          mkdir -p ./Work/texk/seetexk
          cd ./Work/texk/seetexk
          ../../../texk/seetexk/configure
          make
          make check

      - name: dvidvi
        shell: bash
        run: |
          mkdir -p ./Work/texk/dvidvi
          cd ./Work/texk/dvidvi
          ../../../texk/dvidvi/configure
          make
          make check

      - run: echo "⛄ This job's status is ${{ job.status }}."
