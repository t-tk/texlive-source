name: Build on Ubuntu
run-name: building & testing on Ubuntu
on:
  push:
    branches:
      - 'build-ubuntu/**'
      - 'build/**'
jobs:
  Build-on-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - run: echo "The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "This job is now running on a ${{ runner.os }} server hosted by GitHub."
      - run: echo "Branch [ ${{ github.ref }} ]  Repository [ ${{ github.repository }} ]"
      - name: Check out repository code
        uses: actions/checkout@v3

      - name: make libs
        shell: bash
        run: |
          mkdir -p ./Work/libs/{zlib,libpng,libpaper,freetype2,gd,potrace}
          cd ${{ github.workspace }}/Work/libs/zlib
          ../../../libs/zlib/configure
          make
          make check
          cd ${{ github.workspace }}/Work/libs/libpng
          ../../../libs/libpng/configure
          make
          make check
          cd ${{ github.workspace }}/Work/libs/libpaper
          ../../../libs/libpaper/configure
          make
          make check
          cd ${{ github.workspace }}/Work/libs/freetype2
          ../../../libs/freetype2/configure
          make
          make check
          cd ${{ github.workspace }}/Work/libs/gd
          ../../../libs/gd/configure
          make
          make check
          cd ${{ github.workspace }}/Work/libs/potrace
          ../../../libs/potrace/configure
          make
          make check

      - name: make kpathsea, ptexenc
        shell: bash
        run: |
          mkdir -p ./Work/texk/{kpathsea,ptexenc}
          cd ${{ github.workspace }}/Work/texk/kpathsea
          ../../../texk/kpathsea/configure
          make
          make check
          cd ${{ github.workspace }}/Work/texk/ptexenc
          ../../../texk/ptexenc/configure
          make

      - name: make libs
        shell: bash
        run: |
          mkdir -p ./Work/libs/{gmp,mpfr,xpdf,pplib,zziplib,teckit,graphite2,harfbuzz,lua53,luajit}
          cd ${{ github.workspace }}/Work/libs/gmp
          ../../../libs/gmp/configure
          make
          make check
          cd ${{ github.workspace }}/Work/libs/mpfr
          ../../../libs/mpfr/configure
          make
          make check
          cd ${{ github.workspace }}/Work/libs/xpdf
          ../../../libs/xpdf/configure
          make
          make check
          cd ${{ github.workspace }}/Work/libs/pplib
          ../../../libs/pplib/configure
          make
          make check
          cd ${{ github.workspace }}/Work/libs/zziplib
          ../../../libs/zziplib/configure
          make
          make check
          cd ${{ github.workspace }}/Work/libs/teckit
          ../../../libs/teckit/configure
          make
          make check
          cd ${{ github.workspace }}/Work/libs/graphite2
          ../../../libs/graphite2/configure
          make
          make check
          cd ${{ github.workspace }}/Work/libs/harfbuzz
          ../../../libs/harfbuzz/configure
          make
          make check
          cd ${{ github.workspace }}/Work/libs/lua53
          ../../../libs/lua53/configure
          make
          make check
          cd ${{ github.workspace }}/Work/libs/luajit
          ../../../libs/luajit/configure
          make
          make check

      - name: web2c
        shell: bash
        run: |
          mkdir -p ./Work/texk/web2c
          cd ./Work/texk/web2c
          ../../../texk/web2c/configure \
            --srcdir=../../../texk/web2c \
            --disable-all-pkgs \
            --enable-debug \
            --enable-tex  --disable-tex-synctex \
            --enable-ptex  --enable-ptex-synctex \
            --enable-eptex  --enable-eptex-synctex \
            --enable-uptex  --enable-uptex-synctex \
            --enable-euptex  --enable-euptex-synctex \
            --enable-mp  --enable-pmp  --enable-upmp \
            --enable-pdftex  --enable-pdftex-synctex \
            --enable-web-progs  --enable-synctex \
            --enable-mf  --disable-mf-nowin \
            --enable-etex  --enable-etex-synctex \
            --enable-aleph \
            --enable-luatex  --enable-luajittex  --enable-luahbtex  --enable-luajithbtex \
            --enable-xetex  --enable-xetex-synctex \
            --enable-mflua  --disable-mflua-nowin  --enable-mfluajit  --disable-mfluajit-nowin \
            --disable-epsfwin  --disable-hp2627win  --disable-mftalkwin  --disable-nextwin \
            --disable-regiswin  --disable-suntoolswin  --disable-tektronixwin  --disable-unitermwin \
            --disable-missing \
            --with-gnu-ld \
            --without-x \
            --without-mf-x-toolkit \
            --without-system-kpathsea \
            --without-system-ptexenc \
            --without-system-zlib \
            --without-system-libpng \
            --without-system-freetype2 \
            --with-system-pixman \
            --with-system-cairo \
            --without-system-gmp \
            --without-system-mpfr \
            --without-system-poppler \
            --without-system-xpdf \
            --without-system-zziplib \
            --without-system-teckit \
            --with-system-icu \
            --without-system-graphite2 \
            --without-system-harfbuzz
          make

      - name: web2c triptest
        shell: bash
        run: |
          cd ./Work/texk/web2c
          $srcdir/mftraptest.test            || { echo -e "**\n** failed: mftraptest.test\n**"            ; cat mftraptest.log ; }
          $srcdir/triptest.test              || { echo -e "**\n** failed: triptest.test\n**"              ; cat triptest.log ; }
          $srcdir/etexdir/etriptest.test     || { echo -e "**\n** failed: etexdir/etriptest.test\n**"     ; cat etriptest.log ; }
          $srcdir/eptexdir/pdfprimitive.test || { echo -e "**\n** failed: eptexdir/pdfprimitive.test\n**" ; cat pdfprimitivetest.log ; }
          $srcdir/ptexdir/ptriptest.test     || { echo -e "**\n** failed: ptexdir/ptriptest.test\n**"     ; cat ptexdir/ptriptest.log ; }
          $srcdir/uptexdir/ptriptest.test    || { echo -e "**\n** failed: uptexdir/ptriptest.test\n**"    ; cat uptexdir/ptriptest.log ; }
          $srcdir/uptexdir/uptriptest.test   || { echo -e "**\n** failed: uptexdir/uptriptest.test\n**"   ; cat uptexdir/uptriptest.log ; }
          $srcdir/eptexdir/eptriptest.test   || { echo -e "**\n** failed: eptexdir/eptriptest.test\n**"   ; cat eptexdir/eptriptest.log ; }
          $srcdir/euptexdir/euptriptest.test || { echo -e "**\n** failed: euptexdir/euptriptest.test\n**" ; cat euptexdir/euptriptest.log ; }
        env:
          srcdir: "../../../texk/web2c"
          abs_srcdir: "../../../../texk/web2c"
          TEXMFCNF: "../../../texk/kpathsea"
          LN_S: "ln -s"
          DIFF: "diff"

      - name: web2c make check
        shell: bash
        run: |
          cd ./Work/texk/web2c
          make check || :
          cat eptexdir/epver.log || echo -e "**\n** failed to cat eptexdir/epver.log\n**"
          cat euptexdir/eupver.log || echo -e "**\n** failed to cat euptexdir/eupver.log\n**"
          cat omegaware/ligkern.log || echo -e "**\n** failed to cat omegaware/ligkern.log\n**"
          cat omegafonts/ligkern.log || echo -e "**\n** failed to cat omegafonts/ligkern.log\n**"

      #- name: ttf2pk2
      #  shell: bash
      #  run: |
      #    prog='ttf2pk2'
      #    mkdir -p ./Work/texk/$prog
      #    cd ./Work/texk/$prog
      #    ../../../texk/$prog/configure
      #    make
      #    make check || echo -e "**\n** failed: ttf2pk2\n**"
      #    cat tests/ttf2pk.log || echo

      - run: echo "⛄ This job's status is ${{ job.status }}."
